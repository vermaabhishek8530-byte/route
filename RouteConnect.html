<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RouteConnect – Your Route. Your Ride. Shared.</title>
<style>
:root{--p:#153E75;--s:#38BDF8;--g:#22C55E;--bg:#fff;--soft:#F1F7FD;--tx:#0f2440;--mu:#5b6b80;--bd:#dbe7f3;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#7db4f0;--bg:#0b1626;--soft:#10213a;--tx:#e8f0fa;--mu:#9fb0c6;--bd:#223a5a;--card:#12253f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:10px 5vw;background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
nav b{font-size:1.25rem;color:var(--p);margin-right:auto;cursor:pointer}nav b i{color:var(--s);font-style:normal}nav a{padding:8px 12px;border-radius:10px;color:var(--mu);font-weight:600;cursor:pointer;text-decoration:none}nav a:hover{background:var(--soft);color:var(--p)}
.btn{border:0;background:var(--p);color:#fff;padding:11px 20px;border-radius:12px;font:600 .95rem inherit;font-family:inherit;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #153e7533}.btn.g{background:var(--g);color:#06260f}.btn.o{background:transparent;color:var(--p);border:2px solid var(--p)}.btn.r{background:#dc2626}.btn.sm{padding:7px 12px;font-size:.85rem}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:56px 5vw;background:linear-gradient(135deg,var(--soft),var(--bg))}.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:14px 0;color:var(--p)}.hero h1 em{color:var(--s);font-style:normal}.hero p{color:var(--mu);font-size:1.08rem;max-width:520px}
.wrap{max-width:1100px;margin:auto;padding:32px 5vw}h2{color:var(--p);margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
form.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.full{grid-column:1/-1}label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--mu)}
input,select{padding:11px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}input:focus,select:focus{outline:2px solid var(--s)}
.ride{display:grid;grid-template-columns:1fr 170px;gap:14px;margin-bottom:16px}.who{display:flex;gap:12px;align-items:center}.av{width:44px;height:44px;border-radius:50%;background:var(--p);color:var(--bg);display:grid;place-items:center;font-weight:800}
.tag{display:inline-block;background:#dcfce7;color:#15803d;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;margin:2px 4px 2px 0}.tag.b{background:#e0f2fe;color:#0c4a80}.tag.y{background:#fef3c7;color:#92400e}
.pct{font-size:2.2rem;font-weight:800;color:var(--g);text-align:right}.right{text-align:right}.mu{color:var(--mu);font-size:.88rem}.ok{color:var(--g);font-weight:700}.err{color:#dc2626;font-weight:600}.stat{font-size:2rem;font-weight:800;color:var(--g)}
svg.map{width:100%;height:auto;border-radius:12px;background:var(--soft);margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{border:0;background:var(--soft);color:var(--tx);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer}.tabs .on{background:var(--p);color:var(--bg)}
@media(max-width:800px){.hero,.ride{grid-template-columns:1fr}.pct,.right{text-align:left}}
</style></head><body><nav><b id="logo">Route<i>Connect</i></b><a href="#find">Find a Ride</a><a href="#offer">Offer a Ride</a><a href="#dash">Dashboard</a><a id="auth" href="#login"></a></nav><main id="app"></main>
<footer class="wrap mu" style="text-align:center">© RouteConnect · Fares are estimates and can change. Demo uses a sample road network of Rajasthan.</footer>
<script>
const C={Jaipur:[26.9124,75.7873],Dudu:[26.65,75.23],Kishangarh:[26.5727,74.868],Ajmer:[26.4499,74.6399],Pushkar:[26.4897,74.5511],Beawar:[26.1015,74.3203],Jodhpur:[26.2389,73.0243],Tonk:[26.17,75.79],Kota:[25.2138,75.8648],Behror:[27.888,76.282],Delhi:[28.6139,77.209]};
const E=[['Jaipur','Dudu'],['Dudu','Kishangarh'],['Kishangarh','Ajmer'],['Ajmer','Pushkar'],['Ajmer','Beawar'],['Beawar','Jodhpur'],['Jaipur','Behror'],['Behror','Delhi'],['Jaipur','Tonk'],['Tonk','Kota']];
const rad=x=>x*Math.PI/180,hav=(a,b)=>{const h=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const len=p=>p.reduce((s,c,i)=>i?s+hav(p[i-1],c):0,0);
function path(a,b){const q=[[a]],seen={[a]:1};while(q.length){const p=q.shift(),l=p.at(-1);if(l==b)return p;E.forEach(([x,y])=>{const n=x==l?y:y==l?x:null;if(n&&!seen[n]){seen[n]=1;q.push([...p,n])}})}return null}
function poly(stops){let o=[];for(let i=1;i<stops.length;i++){const a=C[stops[i-1]],b=C[stops[i]],n=Math.ceil(hav(a,b)/.5);for(let k=(i==1?0:1);k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
const near=(p,l)=>{let bi=0,bd=1e9;l.forEach((c,i)=>{const d=hav(p,c);if(d<bd){bd=d;bi=i}});return{i:bi,d:bd}};
function match(from,to,when,ride,tol=20,maxMin=90){const s=poly(path(from,to)),r=ride.pts,nr=s.map(p=>near(p,r)),on=nr.map((n,i)=>n.d<=tol?i:-1).filter(i=>i>=0);if(on.length<2)return null;
 const a=on[0],b=on.at(-1);if(nr[a].i>=nr[b].i)return null;const com=s.slice(a,b+1),ck=len(com);if(ck<3)return null;
 const diff=Math.abs(when-ride.time)/6e4;if(diff>maxMin)return null;const detour=+(nr[a].d+nr[b].d).toFixed(1),rk=len(r),sk=len(s);
 const score=100*(.55*ck/sk+.2*Math.min(1,ck/rk)+.15*(1-diff/maxMin)+.1*Math.max(0,1-detour/tol));
 const ppl=ride.reqs.filter(q=>q.st=='accepted').length+1,solo=ride.fare*ck/rk,fare=solo/(ppl+1);
 return{pct:Math.round(score),km:+ck.toFixed(0),detour,fare:Math.round(fare),save:Math.round(solo-fare),com,same:to==ride.to}}
const tm=(h,m=0,d=1)=>{const t=new Date();t.setDate(t.getDate()+d);t.setHours(h,m,0,0);return +t};
const seed=()=>[['Rohit S.','Jaipur','Ajmer',tm(8),3,2400,'Sedan'],['Neha K.','Jaipur','Beawar',tm(8,30),2,3800,'SUV'],['Arjun M.','Jaipur','Delhi',tm(7,30),3,5200,'SUV'],['Sana P.','Ajmer','Jaipur',tm(8),3,2300,'Hatchback']].map((r,i)=>mk({id:'s'+i,owner:r[0],seed:1},r[1],r[2],r[3],r[4],r[5],r[6]));
function mk(o,from,to,time,seats,fare,veh){const st=path(from,to);return{...o,from,to,time,seats,fare,veh,stops:st,pts:poly(st),reqs:o.reqs||[]}}
let S={user:null,rides:[],mine:[]};try{S=JSON.parse(localStorage.getItem('rc2'))||S}catch(e){}
if(!S.rides.length){S.rides=seed();}
const save=()=>{try{localStorage.setItem('rc2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});const $=id=>document.getElementById(id);
const opts=(v)=>Object.keys(C).sort().map(c=>`<option ${c==v?'selected':''}>${c}</option>`).join('');
function svg(ride,com){const X=l=>40+(l[1]-72.8)/4.7*520,Y=l=>20+(28.9-l[0])/4.2*360,pt=p=>p.map(c=>X(c).toFixed(0)+','+Y(c).toFixed(0)).join(' ');
 return `<svg class="map" viewBox="0 0 600 400" role="img" aria-label="Route map">${E.map(([a,b])=>`<polyline points="${pt([C[a],C[b]])}" stroke="var(--bd)" stroke-width="3" fill="none"/>`).join('')}
 <polyline points="${pt(ride.pts)}" stroke="#153E75" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>${com?`<polyline points="${pt(com)}" stroke="#22C55E" stroke-width="9" fill="none" stroke-linecap="round"/>`:''}
 ${Object.entries(C).map(([n,l])=>`<circle cx="${X(l)}" cy="${Y(l)}" r="4" fill="var(--tx)"/><text x="${X(l)+7}" y="${Y(l)+4}" font-size="11" fill="var(--mu)">${n}</text>`).join('')}</svg>`}
function nav(){$('auth').textContent=S.user?'Sign out ('+S.user.name.split(' ')[0]+')':'Login / Sign up';$('auth').href=S.user?'#out':'#login'}
const V={
home:()=>`<section class="hero"><div><span class="tag b">Different destinations, same route, one shared cab</span><h1>Your Route. Your Ride. <em>Shared.</em></h1><p>RouteConnect compares real road routes and matches you with people heading the same way, even when your final stops differ. Split the fare and save.</p><p><a class="btn g" href="#find" style="text-decoration:none;display:inline-block">Search Ride</a> <a class="btn o" href="#offer" style="text-decoration:none;display:inline-block">Offer Ride</a></p></div>
<svg viewBox="0 0 400 240" style="width:100%" aria-label="Passengers sharing a cab"><path d="M20 200 Q150 50 380 110" stroke="#38BDF8" stroke-width="6" fill="none" stroke-dasharray="10 8"/><rect x="120" y="100" width="150" height="55" rx="24" fill="#153E75"/><rect x="155" y="78" width="85" height="38" rx="15" fill="#2a63a8"/>${[175,200,225].map(x=>`<circle cx="${x}" cy="94" r="9" fill="#fff"/>`).join('')}<circle cx="165" cy="158" r="15" fill="#0f2440"/><circle cx="235" cy="158" r="15" fill="#0f2440"/><circle cx="20" cy="200" r="9" fill="#22C55E"/><circle cx="380" cy="110" r="9" fill="#22C55E"/></svg></section>
<div class="wrap"><h2>How RouteConnect works</h2><div class="grid">${[['1 · Enter your trip','Choose pickup, drop, date and time.'],['2 · We match routes','Overlapping roads, direction, detour and timing are scored.'],['3 · Request and ride','Host approves, fare is split, everyone saves.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div>
<h2 style="margin-top:36px">Why travellers love it</h2><div class="grid">${['Save up to 60% on every trip','Matches even with different destinations','Verified profiles and ride approvals','Live seat availability'].map(x=>`<div class="card">✅ ${x}</div>`).join('')}</div>
<h2 style="margin-top:36px">Testimonials</h2><div class="grid"><div class="card">“Jaipur to Ajmer, shared with someone going to Kishangarh. Saved ₹600!” – Priya</div><div class="card">“Finally a way to fill empty seats on my weekly trip.” – Amit</div></div></div>`,
find:(q={})=>{const d=new Date(Date.now()+864e5).toISOString().slice(0,10);return `<div class="wrap"><h2>Find a Ride</h2><form class="card" id="ff"><label>Starting location<select name="f">${opts(q.f||'Jaipur')}</select></label><label>Destination<select name="t">${opts(q.t||'Kishangarh')}</select></label><label>Travel date<input type="date" name="d" value="${d}" required></label><label>Departure time<input type="time" name="h" value="08:00" required></label><label>Passengers<input type="number" name="n" min="1" max="6" value="1"></label><button class="btn full">Search</button></form><div id="res"></div></div>`},
offer:()=>S.user?`<div class="wrap"><h2>Offer a Ride</h2><form class="card" id="of"><label>Pickup<select name="f">${opts('Jaipur')}</select></label><label>Destination<select name="t">${opts('Ajmer')}</select></label><label>Date<input type="date" name="d" value="${new Date(Date.now()+864e5).toISOString().slice(0,10)}" required></label><label>Departure time<input type="time" name="h" value="09:00" required></label><label>Available seats<input type="number" name="s" min="1" max="6" value="3"></label><label>Total estimated cab fare (₹)<input type="number" name="c" min="100" value="2500" required></label><label>Vehicle<select name="v"><option>Hatchback</option><option>Sedan</option><option>SUV</option></select></label><label>Contact<input name="p" value="${esc(S.user.phone)}" required></label><p class="mu full" id="stops"></p><button class="btn full">Publish Ride</button></form></div>`:V.login('Log in to offer a ride.'),
login:(m='')=>`<div class="wrap" style="max-width:480px"><h2>Login / Sign up</h2><p class="mu">${m}</p><form class="card" id="lf" style="grid-template-columns:1fr"><label>Full name<input name="name" required minlength="2"></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone" pattern="\\+?[0-9]{10,13}" title="10–13 digits" required></label><label>Gender (optional)<select name="g"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></label><button class="btn">Continue</button><p class="mu">Demo: accounts stay in this browser. A real launch needs a server for passwords, OTP verification and password reset.</p></form></div>`,
details:id=>{const r=S.rides.find(x=>x.id==id),m=S.last&&S.last[id];if(!r)return'<div class="wrap">Ride not found.</div>';const left=r.seats-r.reqs.filter(q=>q.st=='accepted').length;
 return `<div class="wrap"><h2>${r.from} → ${r.to}</h2>${svg(r,m&&m.com)}<div class="grid" style="margin-top:14px"><div class="card"><h3>Route</h3><p>Via ${r.stops.join(' → ')}<br>Departs ${fmt(r.time)}<br>${r.veh}</p></div><div class="card"><h3>Fare split</h3><p>Total cab fare ₹${r.fare}${m?`<br>Your share <b>₹${m.fare}</b><br><span class="ok">Save ~₹${m.save}</span>`:''}</p><p class="mu">Estimates only; fares can change.</p></div><div class="card"><h3>Members · ${left} seat(s) left</h3><p>🚗 ${esc(r.owner)} (host)</p>${r.reqs.filter(q=>q.st=='accepted').map(q=>`<p>👤 ${esc(q.name)}</p>`).join('')}</div></div><p style="margin-top:14px">${m?`<button class="btn g" data-join="${id}">Request to Join</button> `:''}<a class="btn o" href="#find" style="text-decoration:none;display:inline-block">Back</a></p><p id="msg"></p></div>`},
dash:()=>{if(!S.user)return V.login('Log in to see your dashboard.');const my=S.rides.filter(r=>r.owner==S.user.name&&!r.seed),joined=S.rides.flatMap(r=>r.reqs.filter(q=>q.name==S.user.name).map(q=>({r,q}))),inc=my.flatMap(r=>r.reqs.filter(q=>q.st=='pending').map(q=>({r,q}))),saved=joined.filter(x=>x.q.st=='accepted').reduce((t,x)=>t+x.q.save,0),T=S.tab||'up',now=Date.now();
 const row=(r,x)=>`<div class="card" style="margin-bottom:10px"><b>${r.from} → ${r.to}</b> · ${fmt(r.time)} ${x}</div>`;
 const tabs=[['up','My upcoming rides'],['off','My offered rides'],['req','Ride requests'],['hist','Booking history']];
 return `<div class="wrap"><h2>Hi, ${esc(S.user.name)}</h2><div class="grid"><div class="card"><div class="stat">₹${saved}</div><div class="mu">Estimated money saved</div></div><div class="card"><div class="stat">${inc.length}</div><div class="mu">Pending requests</div></div><div class="card"><b>${esc(S.user.email)}</b><div class="mu">${esc(S.user.phone)}</div>${S.user.ver?'<span class="tag">✓ Verified</span>':'<button class="btn sm g" data-ver>Verify profile (demo)</button>'}</div></div>
 <div class="tabs">${tabs.map(t=>`<button class="${T==t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
 ${T=='up'?joined.filter(x=>x.r.time>now&&x.q.st!='cancelled').map(x=>row(x.r,`<span class="tag y">${x.q.st}</span> ~₹${x.q.fare}${x.q.st=='accepted'?' · Contact '+esc(x.r.owner)+': '+esc(x.r.contact||'98xxxxxx00'):''} <button class="btn r sm" data-cx="${x.r.id}">Cancel</button>`)).join('')||'<p class="mu">Nothing yet. <a href="#find">Find a ride</a></p>':''}
 ${T=='off'?my.map(r=>row(r,`<span class="tag">${r.cancel?'cancelled':'open'}</span><br>Accepted: ${r.reqs.filter(q=>q.st=='accepted').map(q=>esc(q.name)).join(', ')||'none'}`)).join('')||'<p class="mu">No offered rides.</p>':''}
 ${T=='req'?inc.map(x=>row(x.r,`<br>${esc(x.q.name)} wants ${x.q.from} → ${x.q.to} <button class="btn g sm" data-acc="${x.r.id}|${x.q.name}">Accept</button> <button class="btn r sm" data-rej="${x.r.id}|${x.q.name}">Reject</button>`)).join('')||'<p class="mu">No pending requests.</p>':''}
 ${T=='hist'?joined.filter(x=>x.r.time<=now||x.q.st=='cancelled').map(x=>row(x.r,`<span class="tag b">${x.q.st}</span>`)).join('')||'<p class="mu">No history yet.</p>':''}</div>`}};
function route(){const h=location.hash.slice(1)||'home',[v,arg]=h.split('=');if(v=='out'){S.user=null;save();location.hash='home';return}
 $('app').innerHTML=(V[v]||V.home)(arg);nav();window.scrollTo(0,0);
 const f=$('ff');if(f)f.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f)),when=+new Date(x.d+'T'+x.h);if(x.f==x.t){$('res').innerHTML='<p class="err">Choose different places.</p>';return}
  S.last={};const rs=S.rides.filter(r=>!r.cancel&&r.seats-r.reqs.filter(q=>q.st=='accepted').length>=x.n&&r.time>Date.now()).map(r=>({r,m:match(x.f,x.t,when,r)})).filter(o=>o.m).sort((a,b)=>b.m.pct-a.m.pct);S.q=x;
  $('res').innerHTML=`<h3>${rs.length} matching ride${rs.length==1?'':'s'}</h3>`+(rs.length?'':'<p class="mu">No overlapping rides yet. Offer yours so others can find you.</p>')+rs.map(({r,m})=>{S.last[r.id]=m;const left=r.seats-r.reqs.filter(q=>q.st=='accepted').length;
  return `<div class="card ride"><div><div class="who"><div class="av">${esc(r.owner[0])}</div><div><b>${esc(r.owner)}</b><div class="mu">${r.from} → ${r.to} · ${r.veh}</div></div></div><p>${fmt(r.time)} · <b>${left}</b> seats left · shared <b>${m.km} km</b> · detour ~${m.detour} km</p><span class="tag ${m.same?'':'b'}">${m.same?'Same destination':'Different destination, same route'}</span>${svg(r,m.com)}</div><div><div class="pct">${m.pct}%</div><div class="mu right">match</div><h3 class="right">~₹${m.fare}</h3><div class="ok right">save ~₹${m.save}</div><p class="right"><a class="btn sm" href="#details=${r.id}" style="text-decoration:none;display:inline-block">Details</a></p></div></div>`}).join('')};
 const o=$('of');if(o){const up=()=>{const x=Object.fromEntries(new FormData(o));$('stops').textContent='Route preview: '+(x.f!=x.t?path(x.f,x.t).join(' → '):'pick different places')};o.onchange=up;up();o.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(o));if(x.f==x.t)return;
  S.rides.push(mk({id:'u'+Date.now(),owner:S.user.name,contact:x.p},x.f,x.t,+new Date(x.d+'T'+x.h),+x.s,+x.c,x.v));save();location.hash='dash'}}
 const l=$('lf');if(l)l.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(l));S.user={name:x.name,email:x.email,phone:x.phone};save();location.hash='dash'}}
document.addEventListener('click',e=>{const d=e.target.dataset;if(!d)return;
 if(d.tab){S.tab=d.tab;route()}
 if(d.ver){S.user.ver=1;save();route()}
 if(d.join){if(!S.user){location.hash='login';return}const r=S.rides.find(x=>x.id==d.join),m=S.last[d.join];if(r.owner==S.user.name){$('msg').innerHTML='<span class="err">This is your own ride.</span>';return}
  if(r.reqs.some(q=>q.name==S.user.name&&q.st!='cancelled')){$('msg').innerHTML='<span class="err">Already requested.</span>';return}
  r.reqs.push({name:S.user.name,st:'pending',from:S.q.f,to:S.q.t,fare:m.fare,save:m.save});save();$('msg').innerHTML='<span class="ok">✓ Request sent! Check your dashboard.</span>';
  if(r.seed)setTimeout(()=>{const q=r.reqs.find(q=>q.name==S.user.name&&q.st=='pending');if(q){q.st='accepted';r.contact='98765 4'+r.id.slice(1)+'0210';save();if(location.hash=='#dash')route()}},4000)} // demo: seeded hosts auto-approve
 if(d.cx){const r=S.rides.find(x=>x.id==d.cx);r.reqs.forEach(q=>{if(q.name==S.user.name)q.st='cancelled'});save();route()}
 if(d.acc||d.rej){const[i,n]=(d.acc||d.rej).split('|'),q=S.rides.find(x=>x.id==i).reqs.find(q=>q.name==n&&q.st=='pending');q.st=d.acc?'accepted':'rejected';save();route()}});
$('logo').onclick=()=>location.hash='home';addEventListener('hashchange',route);route();
</script></body></html>
